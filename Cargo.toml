[package]
name = "dm-mc02-cmsis-dap"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cortex-m = { version = "=0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "=0.7.7"
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "=0.1.2"
embassy-stm32 = { version = "=0.6.0", default-features = false, features = ["stm32h723vg", "rt", "time-driver-tim2"] }
embassy-time = { version = "=0.5.1", features = ["tick-hz-1_000_000"] }
embassy-usb = { version = "=0.6.0", default-features = false, features = ["max-interface-count-5"] }
embedded-can = "=0.4.1"
embedded-io-async = "=0.7.0"
heapless = "=0.9.3"
panic-halt = "=1.0.0"
static_cell = "=2.1.1"

[profile.dev]
opt-level = 1
debug = 2
